<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16213E" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="100" fill="none" stroke="#FFD60A" stroke-width="12" opacity="0.8" />

  <!-- Crossed Swords Behind -->
  <g stroke="#E63946" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="140" y1="140" x2="372" y2="372" />
    <line x1="372" y1="140" x2="140" y2="372" />
  </g>
  <g fill="#FFD60A">
    <!-- Sword Crossguards -->
    <rect x="190" y="160" width="40" height="12" rx="4" transform="rotate(45 210 166)" />
    <rect x="282" y="160" width="40" height="12" rx="4" transform="rotate(-45 302 166)" />
  </g>

  <!-- Central Stickman Fighter -->
  <!-- Head -->
  <circle cx="256" cy="180" r="44" fill="#1A1A2E" stroke="#FFD60A" stroke-width="14" filter="url(#glow)" />
  
  <!-- Red Headband / Bandana -->
  <path d="M 212 170 Q 256 160 300 170" fill="none" stroke="#E63946" stroke-width="10" stroke-linecap="round" />
  <path d="M 300 170 Q 330 180 345 200" fill="none" stroke="#E63946" stroke-width="8" stroke-linecap="round" />
  <path d="M 300 170 Q 335 160 350 165" fill="none" stroke="#E63946" stroke-width="6" stroke-linecap="round" />

  <!-- Eyes (Glowing Yellow slit) -->
  <ellipse cx="270" cy="178" rx="7" ry="4" fill="#FFD60A" />

  <!-- Spine / Body -->
  <line x1="256" y1="224" x2="256" y2="340" stroke="#FFD60A" stroke-width="16" stroke-linecap="round" />

  <!-- Arms (Dynamic Combat Stance) -->
  <path d="M 256 250 L 190 280 L 160 230" fill="none" stroke="#FFD60A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 256 250 L 320 280 L 360 240" fill="none" stroke="#FFD60A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Legs (Grounded Battle Stance) -->
  <path d="M 256 340 L 195 400 L 170 450" fill="none" stroke="#FFD60A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 256 340 L 315 390 L 340 445" fill="none" stroke="#FFD60A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ground Blade / Slash Effect -->
  <path d="M 120 460 Q 256 475 392 460" fill="none" stroke="#06D6A0" stroke-width="6" stroke-linecap="round" opacity="0.6" />
</svg>
